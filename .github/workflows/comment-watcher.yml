name: Comment Watcher

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      since_hours:
        description: 'Hours to look back for comments'
        required: false
        default: '1'

concurrency:
  group: comment-watcher
  cancel-in-progress: false

jobs:
  watch:
    # The rocket-reaction claim that makes the watcher idempotent is keyed on
    # BOT_LOGIN, so it is shared by every deployment posting as that account:
    # a second instance does not duplicate a command, it *takes* it, and then
    # serves the review from a repo nobody is watching. Set the
    # ENABLE_COMMENT_WATCHER repo variable on the one instance that owns PR
    # commands; forks leave it unset so enabling Actions stays harmless.
    if: ${{ vars.ENABLE_COMMENT_WATCHER == 'true' }}
    runs-on: [self-hosted, amd-internal]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: .state/
          key: comment-watcher-state-${{ github.run_id }}
          restore-keys: |
            comment-watcher-state-

      - name: Watch for commands
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          HOURS="${{ github.event.inputs.since_hours || '1' }}"
          python scripts/watch_comments.py \
            --bot-repo "${{ github.repository }}" \
            --since-hours "$HOURS"

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state/
          key: comment-watcher-state-${{ github.run_id }}
